[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrea-agent"
version = "0.7.0"
description = "ASTrea - Autonomous Software Engineering Agent"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DFJMSF" },
]
requires-python = ">=3.10"
keywords = ["ai-agent", "coding-agent", "llm", "mcp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/dfjmsf/ASTrea-AGENT"
Repository = "https://github.com/dfjmsf/ASTrea-AGENT"
Issues = "https://github.com/dfjmsf/ASTrea-AGENT/issues"

[project.scripts]
astrea = "cli:main"

[tool.setuptools]
py-modules = ["cli", "cli_commands"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["core*", "config*", "prompts*"]
namespaces = true

[tool.setuptools.package-data]
prompts = ["*.md"]
config = ["mcp_servers.json"]
